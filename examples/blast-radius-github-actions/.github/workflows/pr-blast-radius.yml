name: Hud Blast Radius

on:
  # pull_request_target runs the workflow defined on the BASE branch even when the
  # PR comes from a fork — that's what gives the job access to repo secrets safely.
  # Do NOT switch to `pull_request` (no secrets on fork PRs) and never `actions/checkout`
  # the PR head ref here; the action below pulls the diff via the GitHub API instead.
  pull_request_target:
    branches: [main]
    # paths: ['apps/**', 'src/**']    # uncomment to scope by path
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to analyze (manual runs)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  # id-token: write    # add ONLY for AWS Bedrock (AWS OIDC, not Hud)

jobs:
  blast-radius:
    runs-on: ubuntu-latest
    # If using Bedrock, set these env vars at the job level so they propagate
    # into the composite action's `Run blast radius analysis` step:
    # env:
    #   CLAUDE_CODE_USE_BEDROCK: '1'
    #   AWS_REGION: us-west-2
    #   ANTHROPIC_MODEL: 'anthropic.claude-sonnet-4-5-v2:0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # If using Bedrock, uncomment:
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      #     aws-region: us-west-2

      - uses: ./.github/actions/blast-radius
        with:
          hud-mcp-key: ${{ secrets.HUD_MCP_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # For Bedrock: leave anthropic-api-key empty above and pass model: 'anthropic.claude-sonnet-4-5-v2:0'
          # model: 'opus'
          # lookback-days: '7'
          # max-functions: '80'
          # comment-on-pr: 'true'
