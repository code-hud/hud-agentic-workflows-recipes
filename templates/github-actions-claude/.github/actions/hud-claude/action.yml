name: 'Hud + Claude Code'
description: 'Composite action: install Claude CLI, configure Hud MCP, run a prompt'
author: 'Hud'

inputs:
  hud-mcp-key:
    description: 'Hud MCP key (from Hud dashboard, stored as a repo secret)'
    required: true
  anthropic-api-key:
    description: 'Anthropic API key (omit if using Bedrock — set ANTHROPIC_MODEL + AWS creds via env on the calling step instead)'
    required: false
  task-prompt:
    description: 'Inline task prompt. If empty, reads .github/actions/hud-claude/prompt.txt'
    required: false
    default: ''
  model:
    description: 'Model alias for Claude CLI (sonnet, opus, haiku, or full Bedrock model ID)'
    required: false
    default: 'sonnet'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup MCP config
      id: mcp-config
      shell: bash
      run: |
        set -euo pipefail
        MCP_CONFIG_PATH="$(pwd)/.mcp.json"
        cat > "$MCP_CONFIG_PATH" <<EOF
        {
          "mcpServers": {
            "hud": {
              "command": "npx",
              "args": ["-y", "hud-mcp@v2"],
              "env": {
                "HUD_MCP_KEY": "${{ inputs.hud-mcp-key }}"
              }
            }
          }
        }
        EOF
        echo "mcp-config-path=${MCP_CONFIG_PATH}" >> "$GITHUB_OUTPUT"

    - name: Install Claude Code CLI
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL https://claude.ai/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        claude --version

    - name: Resolve task prompt
      id: prompt
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.task-prompt }}" ]; then
          echo "${{ inputs.task-prompt }}" > /tmp/prompt.txt
        elif [ -f "${{ github.action_path }}/prompt.txt" ]; then
          cp "${{ github.action_path }}/prompt.txt" /tmp/prompt.txt
        else
          echo "No task prompt provided. Pass via inputs.task-prompt or write to .github/actions/hud-claude/prompt.txt."
          exit 1
        fi
        echo "path=/tmp/prompt.txt" >> "$GITHUB_OUTPUT"

    - name: Run agent
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        set -euo pipefail
        cat "${{ steps.prompt.outputs.path }}" | claude \
          --model "${{ inputs.model }}" \
          --mcp-config "${{ steps.mcp-config.outputs.mcp-config-path }}" \
          2>&1 | tee "$GITHUB_STEP_SUMMARY"
